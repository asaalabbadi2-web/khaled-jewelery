# Production compose — images from GitLab Container Registry
# Built and pushed by .gitlab-ci.yml on every push to main.
#
# Deploy command (run by GitLab CI automatically):
#   docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production pull
#   docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production up -d
#   docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production run --rm backend alembic upgrade head

services:
  db:
    image: postgres:16
    container_name: yasargold-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yasargold}
      POSTGRES_USER: ${POSTGRES_USER:-yasargold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    # No env_file: .env.production holds IMAGE_TAG and the app's secrets. Read
    # whole, every deploy's new IMAGE_TAG changed this container's environment
    # and Compose recreated the database mid-deploy (29 Sep 2026). The three
    # POSTGRES_* above come from --env-file. tests/test_production_compose.py
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: registry.gitlab.com/sasalabbadi/khaledjewels/backend:${IMAGE_TAG:-latest}
    container_name: yasargold-backend
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://yasargold:change_me@db:5432/yasargold}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      BYPASS_AUTH_FOR_DEVELOPMENT: "0"
      YASAR_ENV: ${YASAR_ENV:-production}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      ALLOW_DANGEROUS_RESETS: ${ALLOW_DANGEROUS_RESETS:-false}
      LOG_STARTUP_IMPORTS: ${LOG_STARTUP_IMPORTS:-0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/data/backups

  scheduler:
    image: registry.gitlab.com/sasalabbadi/khaledjewels/backend:${IMAGE_TAG:-latest}
    container_name: yasargold-scheduler
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://yasargold:change_me@db:5432/yasargold}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      BYPASS_AUTH_FOR_DEVELOPMENT: "0"
      YASAR_ENV: ${YASAR_ENV:-production}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      ALLOW_DANGEROUS_RESETS: ${ALLOW_DANGEROUS_RESETS:-false}
    command: ["python", "backend/run_schedulers.py"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/data/backups

  nginx:
    image: registry.gitlab.com/sasalabbadi/khaledjewels/web:${IMAGE_TAG:-latest}
    container_name: yasargold-nginx
    # No env_file: nginx serves a static config baked into the image and needs
    # none of the app's secrets.
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backup_data:
