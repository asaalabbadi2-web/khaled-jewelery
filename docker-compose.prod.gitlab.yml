# Production compose — images from GitLab Container Registry
# Built and pushed by .gitlab-ci.yml on every push to main.
#
# Deploy (update-prod.ps1 by hand; .gitlab-ci.yml's job the same) -- the
# migration first, then the app: the app's start writes the models' tables and
# columns (create_all, schema_guard), and a migration then meeting them fails,
# its backfill never run. tests/test_production_compose.py
#   docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production pull
#   docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production run --rm backend bash -c "cd /app/backend && alembic upgrade head"
#   docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production up -d

# Every service: restart: unless-stopped -- a container that dies (the scheduler
# exits on purpose when a critical scheduler fails) or a machine that reboots
# comes back on its own. tests/test_production_compose.py
services:
  db:
    image: postgres:16
    container_name: yasargold-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yasargold}
      POSTGRES_USER: ${POSTGRES_USER:-yasargold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    # No env_file: .env.production holds IMAGE_TAG and the app's secrets. Read
    # whole, every deploy's new IMAGE_TAG changed this container's environment
    # and Compose recreated the database mid-deploy (29 Sep 2026). The three
    # POSTGRES_* above come from --env-file. tests/test_production_compose.py
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: registry.gitlab.com/sasalabbadi/khaledjewels/backend:${IMAGE_TAG:-latest}
    container_name: yasargold-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://yasargold:change_me@db:5432/yasargold}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      BYPASS_AUTH_FOR_DEVELOPMENT: "0"
      YASAR_ENV: ${YASAR_ENV:-production}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}   # the photos (ADR-094)
      ALLOW_DANGEROUS_RESETS: ${ALLOW_DANGEROUS_RESETS:-false}
      LOG_STARTUP_IMPORTS: ${LOG_STARTUP_IMPORTS:-0}
      TLS_STATUS_FILE: /data/tls-status/pos-cert.json   # the certificate's status, for «صحة النظام» (ADR-098)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/data/backups
      - media_data:/data/media
      - tls_status:/data/tls-status:ro

  scheduler:
    image: registry.gitlab.com/sasalabbadi/khaledjewels/backend:${IMAGE_TAG:-latest}
    container_name: yasargold-scheduler
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://yasargold:change_me@db:5432/yasargold}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      BYPASS_AUTH_FOR_DEVELOPMENT: "0"
      YASAR_ENV: ${YASAR_ENV:-production}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}   # the photos (ADR-094)
      ALLOW_DANGEROUS_RESETS: ${ALLOW_DANGEROUS_RESETS:-false}
    command: ["python", "backend/run_schedulers.py"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/data/backups
      - media_data:/data/media

  nginx:
    image: registry.gitlab.com/sasalabbadi/khaledjewels/web:${IMAGE_TAG:-latest}
    container_name: yasargold-nginx
    restart: unless-stopped
    # No env_file: nginx serves a static config baked into the image and needs
    # none of the app's secrets.
    # ADR-098: the name (POS_HOST, in .env.production -- not a secret) over
    # HTTPS once its certificate is there; the internal address over HTTP as
    # before, the fallback when the internet is cut.
    environment:
      POS_HOST: ${POS_HOST:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - tls_certs:/etc/letsencrypt:ro
    depends_on:
      - backend

  # The name's certificate (ADR-098): Let's Encrypt by DNS-01 through
  # Cloudflare -- no port opened. The token is a file on the server
  # (CLOUDFLARE_CREDENTIALS_FILE, default ./secrets/cloudflare.ini, never in
  # Git), mounted read-only here alone; the certificates are nginx's and this
  # tool's alone; the backend reads only the status file. No POS_HOST: it rests.
  certbot:
    image: registry.gitlab.com/sasalabbadi/khaledjewels/certbot:${IMAGE_TAG:-latest}
    container_name: yasargold-certbot
    restart: unless-stopped
    environment:
      POS_HOST: ${POS_HOST:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - tls_certs:/etc/letsencrypt
      - tls_status:/status
      - ${CLOUDFLARE_CREDENTIALS_FILE:-./secrets/cloudflare.ini}:/run/secrets/cloudflare.ini:ro

volumes:
  postgres_data:
  backup_data:
  media_data:
  tls_certs:
  tls_status:
