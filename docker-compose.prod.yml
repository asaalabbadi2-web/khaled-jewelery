services:
  db:
    image: postgres:16
    container_name: yasargold-db
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yasargold}
      POSTGRES_USER: ${POSTGRES_USER:-yasargold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yasargold-backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://yasargold:change_me@db:5432/yasargold}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      BYPASS_AUTH_FOR_DEVELOPMENT: "0"
      YASAR_ENV: ${YASAR_ENV:-production}
      TZ: ${TZ:-Asia/Riyadh}
      # Persist server-side snapshots/audit logs and allow UI download/restore.
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}   # the photos (ADR-094)
      # Keep this OFF by default; enable only during a controlled maintenance window.
      ALLOW_DANGEROUS_RESETS: ${ALLOW_DANGEROUS_RESETS:-false}
      # Optional: Google Drive backups via Service Account (no browser OAuth)
      GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE:-/run/secrets/google_drive_sa.json}
      GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${GOOGLE_DRIVE_BACKUP_FOLDER_ID:-}
      # Enable verbose import logging to diagnose startup errors (set to 0 once stable)
      LOG_STARTUP_IMPORTS: ${LOG_STARTUP_IMPORTS:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/data/backups
      - media_data:/data/media
      - ./secrets/google_drive_sa.json:/run/secrets/google_drive_sa.json:ro

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yasargold-scheduler
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://yasargold:change_me@db:5432/yasargold}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      BYPASS_AUTH_FOR_DEVELOPMENT: "0"
      YASAR_ENV: ${YASAR_ENV:-production}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      MEDIA_ROOT: ${MEDIA_ROOT:-/data/media}   # the photos (ADR-094)
      ALLOW_DANGEROUS_RESETS: ${ALLOW_DANGEROUS_RESETS:-false}
      TZ: ${TZ:-Asia/Riyadh}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE:-/run/secrets/google_drive_sa.json}
      GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${GOOGLE_DRIVE_BACKUP_FOLDER_ID:-}
    command: ["python", "backend/run_schedulers.py"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/data/backups
      - media_data:/data/media
      - ./secrets/google_drive_sa.json:/run/secrets/google_drive_sa.json:ro

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_BASE_URL: /api
        GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
    container_name: yasargold-nginx
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backup_data:
  media_data:
