# The shop's address over HTTP, as before ADR-098 -- and, since it, the
# fallback when the internet is cut: pos.khaledjewels.com needs the internet
# to resolve, the internal address does not. Never redirected. Every request
# that is not to the name over HTTPS lands here (default_server); the name is
# switched to HTTPS by 40-pos-https.sh once its certificate is there.
server {
    listen 80 default_server;
    include /etc/nginx/snippets/app.conf;
}
