<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- تجديد الذهب (المالك، 10 نوفمبر 2026): القطعة نفسها -- الخاتم بالٍ (باهت مخدوش)
       ثم جديد يلمع، عبر السهم. لون واحد هو لون موضعه (currentColor)، والخدوش محفورة بقناع. -->
  <defs>
    <mask id="worn" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="white"/>
