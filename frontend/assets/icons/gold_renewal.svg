    <path fill="currentColor" stroke="none" d="M10.4 2.6Q10.6 4.4 12.4 4.6Q10.6 4.8 10.4 6.6Q10.2 4.8 8.4 4.6Q10.2 4.4 10.4 2.6Z"/>
