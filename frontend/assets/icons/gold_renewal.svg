    </mask>
  </defs>
  <!-- الخاتم البالي -->
  <g opacity="0.45" mask="url(#worn)">
    <circle data-part="ring" cx="6.5" cy="17.2" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/>
    <path data-part="stone" fill="currentColor" d="M4.9 9.7L8.1 9.7L9 11.05L4 11.05ZM4.35 11.7L8.65 11.7L6.5 14.1Z"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
