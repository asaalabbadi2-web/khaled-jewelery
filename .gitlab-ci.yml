stages:
  - test
  - build
  - deploy

# ─────────────────────────────────────────────
# Clock Guard — ADR-015 §Clock Discipline enforcement
# Scans decision-path dirs for bare datetime.now() calls.
# Runs when domain, workers, or backend services change.
# ─────────────────────────────────────────────
clock-guard:
  stage: test
  image: python:3.12-slim
  script:
    - python scripts/clock_guard.py
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - packages/domain/**/*
        - apps/commerce-api/src/yasargold_commerce/workers/**/*
        - backend/services/**/*
        - scripts/clock_guard.py
        - docs/architecture/.clock-debt-baseline
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - packages/domain/**/*
        - apps/commerce-api/src/yasargold_commerce/workers/**/*
        - backend/services/**/*
        - scripts/clock_guard.py
        - docs/architecture/.clock-debt-baseline

# ─────────────────────────────────────────────
# Backend tests — the gate, as production runs (TEST-001, TEST-002)
# On PostgreSQL (backend/conftest.py creates and drops a throwaway database),
# with the development bypass off, on the backend image's Python. Until
# 30 Sep 2026 CI ran no backend test at all: a bonus test stayed red two
# months unnoticed, and 35 tests passed only on the SQLite they ran on.
# A red gate stops the build stage: no image is built from a red commit.
# ─────────────────────────────────────────────
backend-test:
  stage: test
  image: python:3.11-slim
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    PYTEST_PG_ADMIN_URL: postgresql://postgres@postgres/postgres
    PYTEST_PG_BIN: /usr/lib/postgresql/16/bin
    BYPASS_AUTH_FOR_DEVELOPMENT: "0"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: backend-pip
    paths:
      - .pip-cache
  before_script:
    # pg_dump must match the server's major version (the backup tests run it).
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates >/dev/null
    - install -d /usr/share/postgresql-common/pgdg
    - curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
    - echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client-16 >/dev/null
    - pip install -q -r backend/requirements.txt
  script:
    - cd backend && python -m pytest -q -p no:cacheprovider
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─────────────────────────────────────────────
# ERP Seam Ratchet — ADR-023 M1 enforcement
# Runs when ERP code or the seam ledger changes.
# Fails if contract-test coverage ratio drops.
# ─────────────────────────────────────────────
erp-seam-ratchet:
  stage: test
  image: python:3.12-slim
  script:
    - python scripts/erp_seam_ratchet.py
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/**/*
        - docs/architecture/erp-seam-ledger.md
        - scripts/erp_seam_ratchet.py
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/**/*
        - docs/architecture/erp-seam-ledger.md
        - scripts/erp_seam_ratchet.py

# ─────────────────────────────────────────────
# launchd plist guard
# A literal && inside a <string> once made both macOS backup agents invalid XML,
# so launchctl could not load them at all and the scheduled backup was silently
# uninstallable.  Runs when a plist or the guard changes.
# NOTE: plutil on macOS is lenient (it accepts `--` inside an XML comment, which
# is illegal XML); this guard uses Python's strict parser deliberately.
# ─────────────────────────────────────────────
plist-guard:
  stage: test
  image: python:3.12-slim
  script:
    - python scripts/plist_guard.py
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/ops/**/*.plist
        - scripts/plist_guard.py
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backend/ops/**/*.plist
        - scripts/plist_guard.py

# ─────────────────────────────────────────────
# Web (Next.js storefront) — 7 CI gates
# Runs only when apps/web/** or packages/contracts/** change.
# DO NOT modify Python/backend jobs above or below.
# ─────────────────────────────────────────────
web-test:
  stage: test
  image: node:22-alpine
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install --frozen-lockfile
  script:
    # Gate 1: TypeScript
    - pnpm --filter yasargold-web typecheck
    # Gate 2: ESLint (covers no-hex-color + jsx-a11y)
    - pnpm --filter yasargold-web lint
    # Gate 3: State coverage + server-clock unit tests
    - pnpm --filter yasargold-web test
    # Gate 4: Brand guard
    - node apps/web/scripts/brand-guard.mjs
    # Gate 5: Import direction
    - pnpm --filter yasargold-web depcruise src
    # Gate 6: Build (catches missing server components / import errors)
    - pnpm --filter yasargold-web build
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - apps/web/**/*
        - packages/contracts/**/*
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/web/**/*
        - packages/contracts/**/*

# ─────────────────────────────────────────────
# Shared Docker build config
# ─────────────────────────────────────────────
.docker-build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ─────────────────────────────────────────────
# Build backend image
# ─────────────────────────────────────────────
build-backend:
  extends: .docker-build
  script:
    - |
      docker build \
        --build-arg BUILD_DATE="$(date -u +%Y%m%dT%H%M%SZ)" \
        -t "$CI_REGISTRY_IMAGE/backend:latest" \
        -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" \
        -f backend/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"

# ─────────────────────────────────────────────
# Build frontend (Flutter web + nginx) image
# ─────────────────────────────────────────────
build-web:
  extends: .docker-build
  script:
    - |
      docker build \
        --build-arg API_BASE_URL=/api \
        -t "$CI_REGISTRY_IMAGE/web:latest" \
        -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA" \
        -f frontend/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE/web:latest"
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA"

# ─────────────────────────────────────────────
# Deploy to production via local Windows runner
# ─────────────────────────────────────────────
deploy-production:
  stage: deploy
  tags:
    - windows-docker
  needs:
    - build-backend
    - build-web
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Production lives at C:\Projects\khaledjewels since the 2026-09-26 rebuild
    # (docs/runbooks/recovery-snapshot-2026-09-26.md).  The old C:\khaled-jewelery is
    # NOT production: Compose derives its project name from the folder, so that path
    # resolves to a different volume namespace (khaled-jewelery_postgres_data rather
    # than khaledjewels_postgres_data) -- a deploy from there would not touch
    # production's database at all.
    - cd C:\Projects\khaledjewels
    - docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production pull
    # Migrate BEFORE starting the new app version. Two reasons, both learned
    # from a real incident (see docs/runbooks and the Phase 16C deploy):
    #   1. backend/app.py calls db.create_all() at import time (for gunicorn),
    #      so an app that boots first creates new tables straight from the
    #      models. The schema then looks correct while alembic_version stays
    #      behind, and anything only a migration can do -- above all a backfill
    #      -- silently never runs. That is exactly how Phase 16C reached
    #      production with its tables present and 0 of 153 obligations
    #      backfilled.
    #   2. A half-migrated schema must never serve traffic.
    # `run --rm` rather than `exec`, so this does not depend on the app
    # container already being up; compose starts db first and waits for its
    # healthcheck through backend's depends_on: service_healthy.
    # A non-zero exit fails the job here, leaving the previous version running.
    - docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production run --rm backend bash -c "cd /app/backend && alembic upgrade head"
    - docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production run --rm backend bash -c "cd /app/backend && alembic current"
    - docker compose -f docker-compose.prod.gitlab.yml --env-file .env.production up -d --remove-orphans
    - echo "Deploy completed successfully"
  environment:
    name: production
  # Manual only. Production is deployed with update-prod.ps1 on the server, and
  # only after a GREEN rehearsal on a fresh backup (docs/runbooks/release-rehearsal.md).
  # No runner is registered today; if one ever is, a push to main must not turn
  # into a deploy on its own.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
